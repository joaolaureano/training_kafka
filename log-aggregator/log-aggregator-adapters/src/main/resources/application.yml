spring:
  application:
    name: log-aggregator

  # Sem profile explícito, imprime no console: dá para ver o fluxo funcionando
  # sem criar arquivo nenhum.
  profiles:
    default: stdout

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: log-aggregator
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: dev.joaolaureano.trainingkafka.logs.adapters.messaging.ApplicationLogMessage
        spring.json.use.type.headers: false
        spring.json.trusted.packages: dev.joaolaureano.trainingkafka.logs.adapters.messaging
    listener:
      concurrency: 1

logs:
  jsonl:
    path: data/logs.jsonl
  duckdb:
    # Arquivo próprio: o DuckDB só aceita um processo escritor por arquivo.
    path: data/logs.duckdb

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    root: INFO
    dev.joaolaureano.trainingkafka: DEBUG
