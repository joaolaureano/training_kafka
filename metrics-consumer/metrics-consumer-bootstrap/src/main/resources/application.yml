spring:
  application:
    name: metrics-consumer

  # Sem profile explícito, roda em memória: dá para experimentar o serviço
  # inteiro sem criar arquivo nenhum no disco.
  profiles:
    default: inmemory

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: metrics-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # O produtor não envia cabeçalho de tipo — este contexto declara qual
        # classe SUA espera. É o que mantém os dois bounded contexts desacoplados.
        spring.json.value.default.type: dev.joaolaureano.trainingkafka.analytics.adapters.messaging.OrderPlacedMessage
        spring.json.use.type.headers: false
        spring.json.trusted.packages: dev.joaolaureano.trainingkafka.analytics.adapters.messaging
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
    listener:
      # ProductSalesRecord não é seguro para escritas concorrentes: o mesmo
      # produto aparece em pedidos de clientes diferentes. O detector de fraude
      # foi separado para Kafka Streams, que mantém o estado por customerId.
      concurrency: 1

# Dead Letter Queue.
#
# Falha transitória (banco fora do ar, rede piscando) é retentada com backoff
# exponencial. Falha permanente — payload que a Anticorruption Layer recusa —
# vai direto para <tópico>-dlt, sem gastar tentativa, com os cabeçalhos de
# diagnóstico anexados (exceção, causa, tópico/partição/offset de origem).
#
# enabled: false volta ao comportamento antigo (registrar e descartar).
kafka:
  dlq:
    enabled: true
    topic-suffix: -dlt
    # O broker está com auto-criação de tópicos desligada; sem isto a
    # republicação falharia com UNKNOWN_TOPIC_OR_PARTITION.
    create-topics: true
    partitions: 3
    replicas: 1
    retry:
      attempts: 2
      initial-interval: 1s
      multiplier: 2.0
      max-interval: 10s

analytics:
  persistence:
    sqlite:
      path: data/metrics.db
    duckdb:
      path: data/metrics.duckdb

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    dev.joaolaureano.trainingkafka: DEBUG
