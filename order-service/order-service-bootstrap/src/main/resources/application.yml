spring:
  application:
    name: order-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        # Sem cabeçalho de tipo Java na mensagem. Se ele fosse enviado, o consumidor
        # precisaria conhecer o nome completo da classe do PRODUTOR para desserializar
        # — um acoplamento entre bounded contexts pelo classpath, que é justamente o
        # que a tradução na fronteira existe para evitar.
        spring.json.add.type.headers: false
        # Preserva a ordem por partição mesmo com retentativa.
        max.in.flight.requests.per.connection: 1
        enable.idempotence: true
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: dev.joaolaureano.trainingkafka.orders.adapters.messaging.PaymentEventMessage
        spring.json.use.type.headers: false
        spring.json.trusted.packages: dev.joaolaureano.trainingkafka.orders.adapters.messaging
    listener:
      # Uma thread por partição de `payment-events`. Os resultados de um mesmo
      # pedido caem sempre na mesma partição (chave = orderId), então o paralelismo
      # não ameaça a ordem que a guarda de transição do agregado depende.
      concurrency: 3

order:
  payment:
    # Grupo próprio: o consumo de payment-events é independente do de qualquer
    # outro tópico e precisa do próprio offset.
    group-id: ${ORDER_PAYMENT_GROUP_ID:order-service-payment}
  persistence:
    sqlite:
      path: ${ORDER_DB_PATH:data/orders.db}
  outbox:
    relay-interval-ms: 200
    # Lote grande de propósito: o relay põe tudo em voo de uma vez e confirma
    # depois, então o custo por linha é ínfimo perto do round-trip que ele evita.
    batch-size: 500
    send-timeout-seconds: 10

kafka:
  dlq:
    enabled: true
    topic-suffix: -dlt
    create-topics: true
    partitions: 3
    replicas: 1
    retry:
      attempts: 2
      initial-interval: 1s
      multiplier: 2.0
      max-interval: 10s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    dev.joaolaureano.trainingkafka: DEBUG
