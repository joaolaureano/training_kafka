spring:
  application:
    name: payment-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: dev.joaolaureano.trainingkafka.payment.adapters.messaging.InventoryEventMessage
        spring.json.use.type.headers: false
        spring.json.trusted.packages: dev.joaolaureano.trainingkafka.payment.adapters.messaging
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
      acks: all
    listener:
      # Uma thread por partição de `inventory-events`. Com 1, duas das três
      # partições ficavam ociosas e a Saga inteira herdava a vazão de um
      # consumidor só.
      concurrency: 3

payment:
  fraud:
    # Grupo próprio: fraud-events tem contrato e offset independentes de orders.
    group-id: ${PAYMENT_FRAUD_GROUP_ID:payment-service-fraud}
  gateway:
    approval-limit: ${PAYMENT_APPROVAL_LIMIT:1000.00}
  persistence:
    sqlite:
      path: ${PAYMENT_DB_PATH:data/payment.db}
  outbox:
    relay-interval-ms: 200
    # Lote grande de propósito: o relay põe tudo em voo de uma vez e confirma
    # depois, então o custo por linha é ínfimo perto do round-trip que ele evita.
    batch-size: 500
    send-timeout-seconds: 10

kafka:
  dlq:
    enabled: true
    topic-suffix: -dlt
    create-topics: true
    partitions: 3
    replicas: 1
    retry:
      attempts: 2
      initial-interval: 1s
      multiplier: 2.0
      max-interval: 10s
